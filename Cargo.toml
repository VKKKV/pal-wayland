[package]
name = "pal-wayland"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "Static PAL DOS binary analysis and explicit guest semantics"
publish = false

[lib]
name = "pal_wayland"
path = "src/lib.rs"

[[bin]]
name = "pal-wayland-tool"
path = "src/main.rs"

[[bin]]
name = "pal-wayland-lift"
path = "src/bin/pal-wayland-lift.rs"
required-features = ["analysis"]

[features]
default = ["analysis"]
analysis = ["dep:iced-x86"]
window = ["dep:winit", "dep:softbuffer", "dep:wgpu", "dep:pollster"]
# Coarse host tick/frame timings, emitted only when PAL_PROFILE=1.
profiling = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
pipewire = { version = "=0.10.1", features = ["v0_3_49"] }
rtrb = "=0.3.2"
rustix = { version = "=1.1.5", features = ["fs"] }
winit = {version="=0.30.12", optional=true, default-features=false, features=["wayland","wayland-dlopen","rwh_06"]}
softbuffer = {version="=0.4.8", optional=true, default-features=false, features=["wayland","wayland-dlopen"]}
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = { version = "=0.4.0", optional = true, default-features = false }
rustc_apfloat = "=0.2.3"
iced-x86 = { version = "=1.21.0", optional = true, default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
